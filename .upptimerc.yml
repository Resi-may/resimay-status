# Resimay Status — public uptime monitor
# Powered by Upptime (https://upptime.js.org). No servers, runs on GitHub Actions.
# Source: Resi-may/resimay-status (transferred from AJ-4UIT on 2026-05-02). Status page lives at https://status.resimay.ai

owner: Resi-may
repo: resimay-status

# Monitored endpoints. Designed to NOT trigger Vercel Bot Protection challenges
# (Upptime runs from GitHub Actions IPs which Vercel does not auto-verify), so
# we monitor paths that either (a) bypass the WAF (sitemap.xml — see Vercel
# firewall rule "allow-public-crawler-files" added 2026-05-02) or (b) live on
# api.resimay.ai which is a Railway backend with no Vercel WAF in front.
sites:
  - name: Resimay Web
    url: https://resimay.ai/sitemap.xml
    # If sitemap renders, Next.js is up. The HTML root would 429 from Upptime IPs.
    expectedStatusCodes:
      - 200
  - name: Resimay API
    url: https://api.resimay.ai/health
    expectedStatusCodes:
      - 200

status-website:
  cname: status.resimay.ai
  name: Resimay Status
  # Resimay brand: light base + the gradient mark for logo/favicon.
  theme: light
  logoUrl: https://resimay.ai/brand/png/mark/mark-gradient-256.png
  favicon: https://resimay.ai/brand/png/mark/mark-gradient-128.png
  faviconSvg: https://resimay.ai/brand/svg/mark.svg
  introTitle: "Live status of **Resimay** services."
  introMessage: |
    Real-time monitoring of resimay.ai and the API. Checks run every 5 minutes from GitHub Actions.
    For incidents or to reach the team, [contact us](https://resimay.ai/contact).
  navbar:
    - title: Status
      href: /
    - title: Resimay
      href: https://resimay.ai
    - title: Contact
      href: https://resimay.ai/contact
  # Repaint the Upptime template in the Resimay design system: Paper background,
  # Ink text, Cobalt accents, and the brand fonts (Bricolage Grotesque display,
  # Schibsted Grotesk body, Space Mono labels). Overrides the documented theme
  # CSS variables + a few safe element selectors.
  css: |
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
    :root {
      --body-background-color: #F4F2EA;
      --body-text-color: #15161B;
      --card-background-color: #FFFFFF;
      --nav-background-color: #F4F2EA;
      --nav-border-bottom-color: #E7E2D2;
    }
    body {
      background: #F4F2EA !important;
      color: #15161B !important;
      font-family: 'Schibsted Grotesk', system-ui, -apple-system, sans-serif !important;
    }
    h1, h2, h3, h4 {
      font-family: 'Bricolage Grotesque', 'Schibsted Grotesk', sans-serif !important;
      letter-spacing: -0.02em;
    }
    a { color: #2B45E8; }
    a:hover { color: #1F34C0; }
    code, time, .timestamp { font-family: 'Space Mono', monospace !important; }

# Notifications:
#   To get email/Slack alerts on incidents, add NOTIFICATION_* secrets to the
#   repo (Settings → Secrets → Actions). Docs: https://upptime.js.org/docs/notifications
