name: Updates CI
# Runs on demand only (2026-10-15): this workflow rewrites the workflow files and would
# replace the commit-SHA pins below with floating tags. Dependabot (.github/dependabot.yml)
# now proposes action updates instead.
on:
  repository_dispatch:
    types: [updates]
  workflow_dispatch:
jobs:
  release:
    name: Deploy updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update code
        uses: upptime/updates@ee62ea20190641d574fd61d4b7d3949a06e7608a # master 2026-10-15
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
